<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ratal Group — All Forms Design Visual</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1520; color: #1a2e3d; display: flex; height: 100vh; overflow: hidden; }

/* ── LEFT NAV ── */
.left-nav { width: 200px; flex-shrink: 0; background: #0a1018; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; overflow-y: auto; }
.left-nav-title { padding: 16px 14px 10px; font-size: 10px; font-weight: 800; letter-spacing: 2px; color: rgba(255,255,255,0.25); text-transform: uppercase; }
.nav-item { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 9px; border-left: 3px solid transparent; transition: all 0.12s; }
.nav-item:hover { background: rgba(255,255,255,0.04); }
.nav-item.active { border-left-color: var(--c); background: rgba(255,255,255,0.06); }
.nav-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.nav-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.55); }
.nav-item.active .nav-label { color: #fff; }
.nav-count { margin-left: auto; font-size: 9px; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 1px 6px; color: rgba(255,255,255,0.35); font-weight: 700; }

/* ── MAIN AREA ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── TOP BAR ── */
.topbar { background: #0f1923; border-bottom: 1px solid rgba(255,255,255,0.07); padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-section-dot { width: 10px; height: 10px; border-radius: 50%; }
.topbar-title { color: #fff; font-size: 15px; font-weight: 900; }
.topbar-sub { color: rgba(255,255,255,0.35); font-size: 12px; }
.topbar-badge { background: rgba(255,200,0,0.12); border: 1px solid rgba(255,200,0,0.3); color: #ffd700; border-radius: 16px; padding: 4px 12px; font-size: 10px; font-weight: 800; }

/* ── FORM TABS ── */
.form-tabs-bar { background: #111a26; border-bottom: 1px solid rgba(255,255,255,0.07); padding: 0 24px; display: flex; gap: 0; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
.form-tab { padding: 12px 18px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.35); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.12s; flex-shrink: 0; }
.form-tab:hover { color: rgba(255,255,255,0.65); }
.form-tab.active { color: #fff; border-bottom-color: var(--accent); }

/* ── STEP PILLS ── */
.step-bar { background: #0f1923; padding: 10px 24px; display: flex; gap: 6px; align-items: center; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.step-pill { padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1.5px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.35); transition: all 0.12s; }
.step-pill:hover { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.7); }
.step-pill.active { color: #fff; border-color: transparent; }
.step-arrow { color: rgba(255,255,255,0.15); font-size: 14px; }

/* ── CANVAS ── */
.canvas { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 0; background: #111824; }

/* ── MODAL ── */
.modal { width: 900px; max-width: 100%; border-radius: 18px; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.7); }

/* ══ BANNER (step 0) ══ */
.b-wrap { display: flex; height: 480px; }
.b-left { flex: 1; position: relative; display: flex; flex-direction: column; background: #F4F7F4; overflow: hidden; }
.b-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(0,0,0,0.07) 1px, transparent 1px); background-size: 22px 22px; pointer-events: none; }
.b-corner { position: absolute; top: 0; left: 0; width: 0; height: 0; border-style: solid; }
.b-brand { position: absolute; top: 12px; right: 18px; font-size: 9px; font-weight: 800; letter-spacing: 0.5px; z-index: 5; }
.b-close { position: absolute; top: 11px; left: 12px; width: 26px; height: 26px; border-radius: 7px; background: rgba(0,0,0,0.06); border: none; cursor: pointer; font-size: 12px; color: #666; z-index: 10; display: flex; align-items: center; justify-content: center; }
.b-content { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 50px 36px 24px; }
.b-tag { font-size: 9px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
.b-t1 { font-size: 34px; font-weight: 900; text-transform: uppercase; line-height: 1; color: #0d1a2a; }
.b-t2 { font-size: 34px; font-weight: 900; text-transform: uppercase; line-height: 1.05; margin-bottom: 10px; }
.b-desc { font-size: 11px; color: #5a7080; line-height: 1.6; border-left: 3px solid; padding-left: 9px; max-width: 300px; margin-bottom: 16px; }
.b-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.b-pill { padding: 4px 12px; border-radius: 16px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.05); color: #6b7c93; }
.b-start { display: inline-flex; align-items: center; gap: 8px; border: none; border-radius: 26px; padding: 10px 22px; font-size: 13px; font-weight: 800; color: #fff; cursor: pointer; }
.b-right { width: 260px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.b-icon { width: 140px; height: 140px; background: rgba(255,255,255,0.1); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 64px; }

/* ══ WIZARD (step 1+) ══ */
.w-outer { flex: 1; display: flex; padding: 16px; overflow: hidden; }
.w-inner { flex: 1; border-radius: 11px; position: relative; display: flex; overflow: hidden; }
.w-corner { position: absolute; top: 0; right: 0; width: 52%; height: 34%; z-index: 1; opacity: 0.2; }
.w-sidebar { width: 212px; flex-shrink: 0; padding: 18px 14px 14px; display: flex; flex-direction: column; position: relative; z-index: 2; }
.ws-brand { font-size: 9px; font-weight: 800; margin-bottom: 18px; }
.ws-cat { font-size: 8px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; opacity: 0.7; }
.ws-name { font-size: 20px; font-weight: 900; color: #0d1a2a; line-height: 1.1; margin-bottom: 5px; }
.ws-desc { font-size: 10px; color: #5a7080; line-height: 1.5; margin-bottom: 7px; }
.ws-count { font-size: 8px; font-weight: 800; letter-spacing: 1px; margin-bottom: 12px; opacity: 0.65; }
.ws-list { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.ws-item { padding: 8px 0 8px 11px; border-left: 3px solid rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: space-between; cursor: default; }
.ws-label { font-size: 11px; font-weight: 500; color: #aab; }
.ws-item.si-active .ws-label { color: #0d1a2a; font-weight: 700; }
.ws-item.si-done .ws-label { color: #5a8070; }
.ws-check { font-size: 9px; color: #5a8070; }

/* ── White card ── */
.wc { position: absolute; top: 16px; right: 16px; bottom: 16px; left: 238px; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.13); display: flex; flex-direction: column; overflow: hidden; z-index: 3; }
.wc-hdr { padding: 16px 20px 12px; border-bottom: 1px solid #edf2f8; flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between; }
.wc-title { font-size: 16px; font-weight: 800; }
.wc-close { width: 26px; height: 26px; border-radius: 7px; background: #f0f4f8; border: none; cursor: pointer; font-size: 12px; color: #666; display: flex; align-items: center; justify-content: center; }
.wc-body { flex: 1; padding: 14px 20px; overflow-y: auto; }
.wc-footer { padding: 11px 20px; border-top: 1px solid #f0f4f8; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }

/* ── Form fields ── */
.fr { display: flex; gap: 10px; margin-bottom: 12px; }
.fc { flex: 1; min-width: 0; }
.fc.w2 { flex: 2; }
.fl { font-size: 9px; font-weight: 800; color: #8a9db0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.fi { width: 100%; height: 34px; border: 1.5px solid #e8edf5; border-radius: 8px; background: #f8faff; padding: 0 11px; font-size: 12px; color: #c8d4e0; display: flex; align-items: center; }
.fi.fv { background: #fff; border-color: #d0d8e4; color: #1a2e3d; font-weight: 600; }
.fi.fa { color: #1a2e3d; }
.fta { width: 100%; height: 60px; border: 1.5px solid #e8edf5; border-radius: 8px; background: #f8faff; padding: 8px 11px; font-size: 12px; color: #c8d4e0; display: flex; align-items: flex-start; }
.fsec { background: #f8faff; border: 1px solid #e8edf5; border-radius: 9px; padding: 12px 14px; margin-bottom: 12px; }
.fsec-title { font-size: 9px; font-weight: 800; color: #8a9db0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

/* footer btns */
.btn-g { background: #f0f4f8; border: none; border-radius: 8px; padding: 9px 16px; font-size: 12px; font-weight: 700; color: #6b7c93; cursor: pointer; }
.btn-f { border: none; border-radius: 8px; padding: 9px 18px; font-size: 12px; font-weight: 800; color: #fff; cursor: pointer; }
.pdots { display: flex; gap: 4px; }
.pd { width: 5px; height: 5px; border-radius: 50%; background: #d0d8e4; }
.pd.pa { width: 14px; border-radius: 3px; }

/* line items */
.li-tbl { width: 100%; border-collapse: collapse; font-size: 11px; }
.li-tbl th { background: #f0f4f8; padding: 7px 9px; font-size: 9px; font-weight: 800; color: #7a8fa0; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; }
.li-tbl td { padding: 7px 9px; border-bottom: 1px solid #f0f4f8; color: #c8d4e0; }
.li-add { margin-top: 6px; background: #f0f4f8; border: 1.5px dashed #c8d4e0; border-radius: 7px; padding: 7px; width: 100%; font-size: 11px; font-weight: 700; color: #7a8fa0; cursor: pointer; }
.totals-box { margin-top: 10px; display: flex; justify-content: flex-end; }
.totals-inner { background: #f8faff; border: 1px solid #e8edf5; border-radius: 9px; padding: 10px 14px; min-width: 200px; }
.totals-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
.totals-row.tot { border-top: 1px solid #e8edf5; padding-top: 5px; font-size: 14px; font-weight: 900; }

/* ── annotations ── */
.ann-bar { width: 900px; max-width: 100%; margin-top: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.ann { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 9px; padding: 11px 13px; }
.ann-icon { font-size: 14px; margin-bottom: 4px; }
.ann-t { font-size: 10px; font-weight: 800; color: rgba(255,255,255,0.65); margin-bottom: 3px; }
.ann-d { font-size: 10px; color: rgba(255,255,255,0.35); line-height: 1.5; }
</style>
</head>
<body>

<div class="left-nav">
  <div class="left-nav-title">Sections</div>
  <div id="leftNav"></div>

          { name:'BSP Details', desc:'Period, airline, sales and commissions.', fields:[
            [{l:'BSP Period',v:'e.g. Sep 2026 (W1)'},{l:'Airline',v:'Select airline ▾'}],

      { id:'refund', name:'Refund', icon:'↩️',

        t1:'TICKET', t2:'REFUND',
        steps:[
          { name:'Refund Details', desc:'Ticket, reason and refund amount.', fields:[
            [{l:'Ticket Number',v:'Select ticket ▾'},{l:'Customer',v:'Auto-filled',fv:true}],
            [{l:'Refund Reason',v:'Voluntary Cancellation ▾',fv:true},{l:'Refund Date',v:'01/10/2026'}],
            [{l:'Gross Refund (SAR)',v:'Auto-calc',fv:true},{l:'Cancellation Fee (SAR)',v:'e.g. 150'}],

            [{l:'Customer',v:'Select customer ▾'},{l:'Booking Date',v:'01/10/2026'}],
            [{l:'Origin',v:'RUH — Riyadh'},{l:'Destination',v:'DXB — Dubai'}],
            [{l:'Travel Date',v:'15/10/2026'},{l:'Pax Count',v:'1'}],

      { id:'pnl', name:'P&L Report', icon:'📊',
        desc:'Profit & Loss from posted journal entries.\nFilter by entity, department and period.',
        t1:'P&L', t2:'REPORT',
        steps:[
          { name:'Report Filters', desc:'Set period, entity and grouping.', fields:[
            [{l:'Entity',v:'ACCSYS ▾',fv:true},{l:'Period Type',v:'Monthly ▾',fv:true}],
            [{l:'From Period',v:'Jan 2026'},{l:'To Period',v:'Sep 2026'}],
            [{l:'Department Filter',v:'All Departments ▾',fv:true},{l:'View Mode',v:'Summary ▾',fv:true}],

      },
      { id:'balsheet', name:'Balance Sheet', icon:'🏛',
        desc:'Assets = Liabilities + Equity as at a given date.',
        t1:'BALANCE', t2:'SHEET',
        steps:[

            [{l:'Entity',v:'ACCSYS ▾',fv:true},{l:'As-of Date',v:'30/09/2026',fv:false}],
            [{l:'Comparison Period',v:'Prior Year ▾'},{l:'View',v:'Standard ▾',fv:true}],

            [{l:'Currency',v:'SAR ▾',fv:true},{l:'Show Zero Balance?',v:'No ▾',fv:true}],
          ]},

      { id:'vatreturn', name:'VAT Return', icon:'🧮',
        desc:'Compute VAT output, input and net payable\nfor a quarterly ZATCA filing.',
        t1:'VAT', t2:'RETURN',
        steps:[
          { name:'VAT Period', desc:'Select quarter and review auto-calculated amounts.', fields:[
            [{l:'VAT Period',v:'Q3 2026 (Jul–Sep) ▾',fv:true},{l:'Entity',v:'ACCSYS ▾',fv:true}],
            [{l:'Output VAT (SAR)',v:'Auto-calc',fv:true},{l:'Input VAT (SAR)',v:'Auto-calc',fv:true}],

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let curSection = SECTIONS[0];
let curForm = SECTIONS[0].forms[0];
let curStep = 0; // 0 = banner, 1+ = wizard step

// ─────────────────────────────────────────────────────────────────────────────
// RENDER LEFT NAV
// ─────────────────────────────────────────────────────────────────────────────
function renderNav() {
  const el = document.getElementById('leftNav');
  el.innerHTML = '';
  SECTIONS.forEach(s => {
    const d = document.createElement('div');
    d.className = 'nav-item' + (s.id === curSection.id ? ' active' : '');
    d.style.setProperty('--c', s.color);
    d.innerHTML = `<div class="nav-dot" style="background:${s.color}"></div><div class="nav-label">${s.label}</div><div class="nav-count">${s.forms.length}</div>`;
    d.onclick = () => { curSection = s; curForm = s.forms[0]; curStep = 0; renderAll(); };
    el.appendChild(d);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER TOP BAR
// ─────────────────────────────────────────────────────────────────────────────
function renderTopBar() {
  document.getElementById('tbDot').style.background = curSection.color;
  document.getElementById('tbTitle').textContent = curSection.icon + ' ' + curSection.label;
  document.getElementById('tbSub').textContent = `${curSection.forms.length} forms — ${curForm.name} selected`;
  document.body.style.setProperty('--accent', curSection.color);
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER FORM TABS
// ─────────────────────────────────────────────────────────────────────────────
function renderFormTabs() {
  const el = document.getElementById('formTabsBar');
  el.style.setProperty('--accent', curSection.color);
  el.innerHTML = '';
  curSection.forms.forEach(f => {
    const t = document.createElement('div');
    t.className = 'form-tab' + (f.id === curForm.id ? ' active' : '');
    t.style.setProperty('--accent', curSection.color);
    t.textContent = f.icon + ' ' + f.name;
    t.onclick = () => { curForm = f; curStep = 0; renderAll(); };
    el.appendChild(t);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER STEP PILLS
// ─────────────────────────────────────────────────────────────────────────────
function renderStepBar() {
  const el = document.getElementById('stepBar');
  el.innerHTML = '';
  const addPill = (label, idx) => {
    const p = document.createElement('div');
    p.className = 'step-pill' + (idx === curStep ? ' active' : '');
    if (idx === curStep) { p.style.background = curSection.color + '33'; p.style.borderColor = curSection.color; p.style.color = '#fff'; }
    p.textContent = label;
    p.onclick = () => { curStep = idx; renderCanvas(); };
    el.appendChild(p);
    if (idx < curForm.steps.length) {
      const arrow = document.createElement('span');
      arrow.className = 'step-arrow';
      arrow.textContent = '→';
      el.appendChild(arrow);
    }
  };
  addPill('Step 0 — Intro Banner', 0);
  curForm.steps.forEach((s, i) => addPill(`Step ${i+1} — ${s.name}`, i+1));
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER CANVAS
// ─────────────────────────────────────────────────────────────────────────────
function renderCanvas() {
  const el = document.getElementById('canvas');
  el.innerHTML = '';
  const modal = document.createElement('div');
  modal.className = 'modal';

  if (curStep === 0) {
    // BANNER
    modal.style.height = '480px';
    modal.innerHTML = buildBanner();
  } else {
    // WIZARD
    modal.style.height = '500px';
    modal.innerHTML = buildWizard();
  }
  el.appendChild(modal);

  // annotations
  const ann = document.createElement('div');
  ann.className = 'ann-bar';
  ann.innerHTML = buildAnnotations();
  el.appendChild(ann);
}

function buildBanner() {
  const s = curSection, f = curForm;
  const pills = f.steps.map((st, i) =>
    `<span class="b-pill${i===0?' style="background:'+s.color+';color:#fff"':''}">${['①','②','③','④'][i]} ${st.name}</span>`).join('');
  return `<div class="b-wrap">
    <div class="b-left">
      <div class="b-dots"></div>
      <div class="b-corner" style="border-top:100px solid ${s.dark};border-right:100px solid transparent;"></div>
      <div class="b-brand" style="color:${s.color}">Ratal Advanced Technologies</div>
      <button class="b-close">✕</button>
      <div class="b-content">
        <div class="b-tag" style="color:${s.color}">${s.label}</div>
        <div class="b-t1">${f.t1}</div>
        <div class="b-t2" style="color:${s.color}">${f.t2}</div>
        <div class="b-desc" style="border-color:${s.color}">${f.desc.replace('\n','<br>')}</div>
        <div class="b-pills">${pills}</div>
        <button class="b-start" style="background:${s.color}">Start ➤</button>
      </div>
    </div>
    <div class="b-right" style="background:linear-gradient(160deg,${s.dark} 0%,${s.dark}cc 100%)">
      <div class="b-icon">${f.icon}</div>
    </div>
  </div>`;
}

function buildWizard() {
  const s = curSection, f = curForm;
  const stepIdx = curStep - 1;
  const step = f.steps[stepIdx] || f.steps[f.steps.length - 1];

  const stepList = f.steps.map((st, i) => {
    const isAct = i === stepIdx, isDone = i < stepIdx;
    return `<div class="ws-item${isAct?' si-active':isDone?' si-done':''}"
      style="border-left-color:${isAct?s.color:isDone?s.color+'55':'rgba(0,0,0,0.08)'}">
      <span class="ws-label">${st.name}</span>
      ${isDone?'<span class="ws-check">✓</span>':''}
    </div>`;
  }).join('');

  const dots = f.steps.map((_, i) =>
    `<div class="pd${i===stepIdx?' pa':''}" style="${i===stepIdx?'background:'+s.color:''}"></div>`).join('');

  const body = step.lineItems ? buildLineItems(step, s) : buildFields(step.fields);

  return `<div style="display:flex;height:100%;">
    <div class="w-outer" style="background:${s.color}">
      <div class="w-inner" style="background:${s.light}">
        <div class="w-corner" style="background:${s.color}"></div>
        <div class="w-sidebar">
          <div class="ws-brand" style="color:${s.color}">Ratal Advanced Technologies</div>
          <div class="ws-cat" style="color:${s.color}">${f.name}</div>
          <div class="ws-name">${step.name}</div>
          <div class="ws-desc">${step.desc}</div>
          <div class="ws-count" style="color:${s.color}">STEP ${stepIdx+1} OF ${f.steps.length}</div>
          <div class="ws-list">${stepList}</div>
        </div>
        <div class="wc">
          <div class="wc-hdr">
            <div class="wc-title" style="color:${s.color}">${step.name}</div>
            <button class="wc-close">✕</button>
          </div>
          <div class="wc-body">${body}</div>
          <div class="wc-footer">
            <button class="btn-g">${stepIdx===0?'Cancel':'← Back'}</button>
            <div class="pdots">${dots}</div>
            <button class="btn-f" style="background:${s.color}">${stepIdx===f.steps.length-1?'✓ Save & Close':'Next →'}</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function buildFields(rows) {
  return (rows||[]).map(row => {
    const cols = row.map(f => {
      const v = f.v || '';
      const cls = f.fv ? 'fi fv' : 'fi fa';
      const inner = f.ta
        ? `<div class="fta">${v}</div>`
        : `<div class="${cls}">${v}</div>`;
      return `<div class="fc${f.w2?' w2':''}"><div class="fl">${f.l}</div>${inner}</div>`;
    }).join('');
    return `<div class="fr">${cols}</div>`;
  }).join('');
}

function buildLineItems(step, s) {
  const cols = step.liCols || ['Description','Qty','Unit Price','Total'];
  const ths = cols.map(c => `<th>${c}</th>`).join('');
  const tds = cols.map(() => `<td>—</td>`).join('');
  return `
    <table class="li-tbl"><thead><tr>${ths}</tr></thead>
    <tbody>
      <tr>${tds}</tr>
      <tr>${cols.map(()=>'<td style="color:#c8d4e0">Click + to add...</td>').join('')}</tr>
    </tbody></table>
    <button class="li-add" style="border-color:${s.color}55">+ Add Line</button>
    <div class="totals-box">
      <div class="totals-inner">
        <div class="totals-row"><span style="color:#9aabbf">Subtotal</span><span style="font-weight:700">SAR 0.00</span></div>
        <div class="totals-row"><span style="color:#9aabbf">VAT (15%)</span><span style="font-weight:700">SAR 0.00</span></div>
        <div class="totals-row tot"><span style="color:${s.color}">TOTAL</span><span style="color:${s.color}">SAR 0.00</span></div>
      </div>
    </div>`;
}

function buildAnnotations() {
  const s = curSection, f = curForm;
  if (curStep === 0) return [
    {i:'🎨',t:'Section Color',d:`Accent: ${s.color}. Corner triangle, brand text, pill buttons, and Start button all use this exact color.`},
    {i:'🖼️',t:'Right Panel',d:`Dark gradient panel (${s.dark}) with large icon (${f.icon}). Gives the form strong visual identity.`},
    {i:'📍',t:'Step Pills',d:`Shows all ${f.steps.length} steps upfront: ${f.steps.map(s=>s.name).join(', ')}`},
    {i:'📄',t:'Form Description',d:`"${f.desc.replace('\n',' ')}" — every form explains what it's for.`},
  ].map(a=>`<div class="ann"><div class="ann-icon">${a.i}</div><div class="ann-t">${a.t}</div><div class="ann-d">${a.d}</div></div>`).join('');
  const stepIdx = curStep - 1;
  const step = f.steps[stepIdx] || f.steps[0];
  const fieldCount = step.lineItems ? 'line items table' : (step.fields||[]).reduce((n,r)=>n+r.length,0) + ' fields';
  return [
    {i:'🟣',t:'Outer Ring',d:`${s.color} — bold section color wrapping the whole form.`},
    {i:'📋',t:'Left Sidebar',d:`220px: brand → form name → step name → step desc → STEP X OF ${f.steps.length} → step tracker`},
    {i:'🃏',t:'White Card',d:`Step ${curStep}: "${step.name}" — ${fieldCount}. ${step.desc}`},
    {i:'⬛',t:'Progress',d:`Step ${curStep} of ${f.steps.length}. ${stepIdx===0?'Cancel':'← Back'} left / ${stepIdx===f.steps.length-1?'Save & Close':'Next →'} right.`},
  ].map(a=>`<div class="ann"><div class="ann-icon">${a.i}</div><div class="ann-t">${a.t}</div><div class="ann-d">${a.d}</div></div>`).join('');
}

function renderAll() {
  renderNav();
  renderTopBar();
  renderFormTabs();
  renderStepBar();
  renderCanvas();
}

renderAll();
</script>
</body>
</html>
